<article class="card glass">
  <h3>{{ project().title }}</h3>
  <p>{{ project().description }}</p>

  <div class="chips">
    @for (tech of techList(); track tech) {
      <span class="chip">{{ tech }}</span>
    }
  </div>

  <a class="card-link" [href]="project().link" target="_blank" rel="noopener">
    View on GitHub <span>→</span>
  </a>
</article>
